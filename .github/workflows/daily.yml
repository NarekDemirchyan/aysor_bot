name: daily

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL: "@patmutyun_aysor"
          TEST: "0"
          PREVIEW_CHAT: ${{ secrets.PREVIEW_CHAT }}
