name: daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"        # 09:00 Երևան (05:00 UTC)՝ որպես պահուստ

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL: "@patmutyun_aysor"
          TEST: "0"
        run: python bot.py
